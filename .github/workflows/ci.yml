name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      # Unit, contract, pipeline, UI and accessibility tests, plus the offline eval gate (evals/runner/gate.test.ts):
      # the recorded Claude Code outputs are replayed through today's code; F1 may not drop more than 3 points.
      - run: pnpm test:cov
      - name: Generated agent prompt matches @threatline/prompts
        run: cd apps/core && node build.mjs && git diff --exit-code agent/prompt.md
      - name: GitHub Action bundle is up to date
        run: cd apps/github-action && node build.mjs && git diff --exit-code dist/index.mjs ../../scripts/threatline-ci-report.mjs

  github-action:
    name: GitHub Action runs on a real pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Runs the committed bundle against this pull request through GitHub's API. Threatline's own pull requests are not
      # gated (no attestations exist for this repository), so only check that it ran and reported a known outcome.
      - id: gate
        uses: ./apps/github-action
        continue-on-error: true
        with:
          public-keys: KqanawLsTC0herN_Fp-LAriFLgOl5LIbDd_I-_tyMTY
      - name: The action reported an outcome
        env:
          OUTCOME: ${{ steps.gate.outputs.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          case "$OUTCOME" in pass_not_sensitive|pass_attested|fail_missing) ;; *) echo "unexpected outcome: '$OUTCOME'"; exit 1 ;; esac

  security:
    name: Security scans (zero high findings)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the pull request's commits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: semgrep (Threatline rules + registry rulesets; --config auto needs metrics on, so the rulesets are named)
        run: |
          pip install --quiet semgrep
          semgrep scan --config .semgrep.yml --config p/default --config p/typescript --config p/react --config p/secrets \
            --metrics off --severity ERROR --error
      - name: gitleaks (whole history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

  e2e:
    name: End-to-end journeys and layout audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @threatline/e2e exec playwright install --with-deps chromium
      # Journey A, Journey B and the merge check: the real UI against the real resolvers, actions, validator and
      # signing over in-memory Atlassian fakes (e2e/local/server.ts). No account, no network.
      - run: pnpm e2e
      - name: Layout audit (every surface at 320 and 1280 px, light and dark)
        run: |
          pnpm --filter @threatline/core-ui exec vite --port 5179 --strictPort &
          pnpm --filter @threatline/bitbucket-ui exec vite --port 5180 --strictPort &
          npx --yes wait-on@8.0.3 http://localhost:5179 http://localhost:5180
          CHROME="$(cd e2e && node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")" node scripts/layout-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
