app:
  id: ari:cloud:ecosystem::app/13898a7c-6897-48d3-a512-079d9f9f5f00
  runtime:
    name: nodejs22.x
  package:
    bundler: manual@2026
    path: dist
  compatibility:
    jira:
      required: true
    confluence:
      required: false
modules:
  # Threatline Engine: Threatline runs reviews itself on Atlassian-hosted Claude models (billed to the app's developer).
  llm:
    - key: threatline-engine-llm
      model:
        - claude
  sql:
    - key: main
      engine: mysql
  trigger:
    - key: lifecycle
      function: lifecycleFn
      events: [ avi:forge:installed:app, avi:forge:upgraded:app ]
    - key: issue-events
      function: issueEventsFn
      events: [ avi:jira:created:issue, avi:jira:updated:issue ]
      filter:
        ignoreSelf: true
    - key: page-events
      function: pageEventsFn
      events: [ avi:confluence:updated:page ]
  consumer:
    - key: threatline-jobs-consumer
      queue: threatline-jobs
      function: jobConsumerFn
  scheduledTrigger:
    - key: sweeper
      function: sweeperFn
      interval: fiveMinute
    - key: hourly
      function: hourlyFn
      interval: hour
    - key: daily
      function: dailyFn
      interval: day
  # Verification from CI (docs/CI_VERIFICATION.md): CI posts test results with a per-site CI token. No new scope.
  webtrigger:
    - key: ci-verify
      function: ciVerifyFn
      # Static (Runs on Atlassian): the function can only pick one of these fixed answers (apps/core/src/webtriggers/ci-static.ts).
      response:
        type: static
        outputs:
          - key: recorded-pass
            statusCode: 200
            contentType: application/json
            body: "{\"result\":\"recorded\",\"verdict\":\"pass\",\"message\":\"Threatline recorded this CI run. Nothing blocks Done for this work item now.\"}"
          - key: recorded-warn
            statusCode: 200
            contentType: application/json
            body: "{\"result\":\"recorded\",\"verdict\":\"warn\",\"message\":\"Threatline recorded this CI run. The work item is in warn-only mode: Done warns but is not blocked.\"}"
          - key: recorded-block
            statusCode: 200
            contentType: application/json
            body: "{\"result\":\"recorded\",\"verdict\":\"block\",\"message\":\"Threatline recorded this CI run. Security requirements still block Done: see the work item's Threatline panel for which ones.\"}"
          - key: bad-request
            statusCode: 400
            contentType: application/json
            body: "{\"error\":\"validation\",\"message\":\"The report is not valid: send issueKey, repo, a 40-character commitSha, an https runUrl and results (see docs/CI_VERIFICATION.md).\"}"
          - key: unauthorized
            statusCode: 401
            contentType: application/json
            body: "{\"error\":\"unauthorized\",\"message\":\"Send Authorization: Bearer <CI token> (Threatline admin, CI verification).\"}"
          - key: forbidden
            statusCode: 403
            contentType: application/json
            body: "{\"error\":\"forbidden\",\"message\":\"This CI token cannot report for that project, or Threatline is not on for it.\"}"
          - key: not-found
            statusCode: 404
            contentType: application/json
            body: "{\"error\":\"not_found\",\"message\":\"That work item was not found.\"}"
          - key: method
            statusCode: 405
            contentType: application/json
            body: "{\"error\":\"method\",\"message\":\"POST a JSON report.\"}"
          - key: too-large
            statusCode: 413
            contentType: application/json
            body: "{\"error\":\"too_large\",\"message\":\"The report is larger than 256 KB. Send only tests whose names carry a requirement id.\"}"
          - key: rate-limited
            statusCode: 429
            contentType: application/json
            body: "{\"error\":\"rate_limited\",\"message\":\"A CI token can send 120 reports an hour. Try again after the hour.\"}"
          - key: unavailable
            statusCode: 503
            contentType: application/json
            body: "{\"error\":\"unavailable\",\"message\":\"Threatline could not record this report; nothing unrecorded was verified. Retry the job.\"}"
  jira:issuePanel:
    - key: threatline-panel
      resource: panel
      resolver:
        function: panelResolverFn
      title: Threatline security review
      # The brand icon, bundled (docs/brand/icon.svg); Forge accepts resource:<key>;<path> for module icons.
      icon: resource:icons;threatline.svg
  # The gate status on every work item, in the context column on the right, without opening the panel (panel.status:
  # the panel's authorisation and verdict, without its threats or history). No new scope.
  jira:issueContext:
    - key: threatline-status
      resource: panel
      resolver:
        function: panelResolverFn
      title: Threatline
      label: Security gate
      icon: resource:icons;threatline.svg
  jira:adminPage:
    - key: threatline-admin
      resource: panel
      resolver:
        function: panelResolverFn
      title: Threatline
  jira:globalPage:
    - key: threatline-posture
      resource: panel
      resolver:
        function: panelResolverFn
      title: Threatline security posture
  jira:dashboardGadget:
    - key: threatline-posture-gadget
      title: Threatline security posture
      description: Open security requirements by severity, expiring risk acceptances, mean time to verify and reviews in flight, for the work items you can see.
      thumbnail: https://raw.githubusercontent.com/pranavsaji/threatline/main/docs/brand/icon-144.png
      resource: panel
      resolver:
        function: panelResolverFn
  jira:workflowValidator:
    - key: threatline-gate
      name: Threatline security gate
      description: Blocks the transition while Threatline's verdict for the work item is block (open security requirements, or a missing, failed or out-of-date review).
      function: validateTransitionFn
  jira:entityProperty:
    - key: threatline-verdict-index
      entityType: issue
      propertyKey: threatline.verdict
      values:
        - { path: state, type: string, searchAlias: threatlineState }
        - { path: blockingCount, type: number, searchAlias: threatlineBlocking }
        - { path: maxOpenSeverity, type: string, searchAlias: threatlineMaxSeverity }
        - { path: riskScore, type: number, searchAlias: threatlineRisk }
  action:
    - key: get-review-context
      name: Get Threatline review context
      function: getReviewContextFn
      actionVerb: GET
      description: Returns the work item's security review context (design, linked work, pages, incidents) and the JSON output contract. Call this first when reviewing a work item.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
    - key: submit-threat-model
      name: Submit Threatline threat model
      function: submitThreatModelFn
      actionVerb: CREATE
      description: Saves the threat model JSON for a Jira work item as one agent run. Call this once with the complete JSON.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        submissionToken:
          title: Submission token
          type: string
          required: true
          description: The submissionToken returned by get-review-context for this same work item
        threatModelJson:
          title: Threat model JSON
          type: string
          required: true
          description: The complete threat model as a JSON string with "schema" set to "threatline.threatmodel.v1"
    - key: get-merge-attestation
      name: Get Threatline merge attestation
      function: getMergeAttestationFn
      actionVerb: CREATE
      description: Signs a merge attestation for a Jira work item, Bitbucket or GitHub repository and commit when Threatline's verdict allows it, and returns the text to paste into the pull request description. If the work item is blocked, returns what blocks it instead.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        repo:
          title: Repository
          type: string
          required: true
          description: The repository as workspace/repository (Bitbucket) or owner/repository (GitHub), for example acme/payments
        commitSha:
          title: Commit hash
          type: string
          required: true
          description: The full 40-character hash of the pull request's head commit
    - key: get-review
      name: Get Threatline review
      function: getReviewFn
      actionVerb: GET
      description: Returns Threatline's latest security review of a Jira work item - verdict and why, risk score, partial-context flag, threats with refs (T-1, T-2...) and quoted citations, and dataFlowDiagram (elements, flows, trust boundaries).
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
    - key: get-security-requirements
      name: Get security requirements
      function: getRequirementsFn
      actionVerb: GET
      description: Returns a Jira work item's security requirements with acceptance criteria, ASVS ids, status, fix-by date, file hints and optional test skeletons. Call this before editing code for the work item.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        status:
          title: Status
          type: string
          required: false
          description: Only requirements with this status - Open, InProgress, Verified, AcceptedRisk or NotApplicable. Leave empty for all.
        testLanguage:
          title: Test language
          type: string
          required: false
          description: Set to typescript, python or java to get a test skeleton for each requirement, with one failing test per acceptance criterion to fill in. Leave empty otherwise.
    - key: check-change-risk
      name: Check change risk
      function: checkChangeRiskFn
      actionVerb: GET
      description: Previews Threatline's Bitbucket merge check for a change - whether the changed files are security-sensitive, which requirements they touch, and whether the merge would pass. Call this before opening a pull request.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        changedPaths:
          title: Changed paths
          type: string
          required: true
          description: The changed file paths, comma-separated, for example src/auth/session.ts,src/app.ts
        summary:
          title: Change summary
          type: string
          required: false
          description: One line on what the change does (optional)
    - key: request-risk-acceptance
      name: Request risk acceptance
      function: requestAcceptanceFn
      actionVerb: CREATE
      description: Requests a time-boxed risk acceptance for one Threatline security requirement. It is recorded in Threatline's ledger and stays pending until a tech lead or security champion approves it in the Threatline panel. It never takes effect on its own.
      inputs:
        requirementId:
          title: Requirement id
          type: string
          required: true
          description: The Threatline requirement id (req_...) from get-security-requirements
        reason:
          title: Reason
          type: string
          required: true
          description: Why the risk is acceptable for now, at least 10 characters
        controls:
          title: Compensating controls
          type: string
          required: true
          description: What reduces the risk meanwhile, for example a WAF rule or a feature flag, at least 8 characters
        expiryDays:
          title: Expiry in days
          type: integer
          required: true
          description: How many days the acceptance lasts (Critical at most 30, others at most 90 by default)
    - key: verify-requirement
      name: Verify requirement with a pull request
      function: verifyRequirementFn
      actionVerb: UPDATE
      description: Marks one Threatline security requirement Verified with the pull request that fixes it as evidence. Needs edit permission on the work item; attributed to the caller and recorded in Threatline's ledger.
      inputs:
        requirementId:
          title: Requirement id
          type: string
          required: true
          description: The Threatline requirement id (req_...) from get-security-requirements
        prUrl:
          title: Pull request URL
          type: string
          required: true
          description: The https link of the pull request that fixes the requirement
        note:
          title: Note
          type: string
          required: false
          description: Optional, for example the test that proves it
    - key: explain-threat
      name: Explain threat
      function: explainThreatFn
      actionVerb: GET
      description: Explains one threat from a Threatline review in plain language - how the attack works, how to fix it, and OWASP and CWE references.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        threatId:
          title: Threat
          type: string
          required: true
          description: The threat's ref from get-review (for example T-3) or its id (thr_...)
    - key: release-readiness
      name: Check release readiness
      function: releaseReadinessFn
      actionVerb: GET
      description: Says whether a Jira fix version is safe to ship - Go, Go with conditions, or No-go - with the blocking work items and the risk acceptances that expire soon.
      inputs:
        fixVersion:
          title: Fix version
          type: string
          required: true
          description: The Jira fix version name, for example 4.2
    - key: start-review
      name: Start Threatline review
      function: startReviewFn
      actionVerb: TRIGGER
      description: Queues a fresh Threatline security review of a Jira work item. The result appears in the Threatline panel in a minute or two.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
    - key: posture-summary
      name: Get security posture
      function: postureSummaryFn
      actionVerb: GET
      description: Summarises security posture across Threatline-enabled projects - open requirements by severity, the riskiest components, and the risk acceptances that expire in the next 31 days (soonest first).
      inputs:
        project:
          title: Project key
          type: string
          required: false
          description: Only this Jira project, for example PAY. Leave empty for all Threatline-enabled projects.
        team:
          title: Team or component
          type: string
          required: false
          description: Only work items in this Jira component (optional)
  rovo:skill:
    - key: threat-model-review
      source:
        dir: skills/threat-model-review
      dependencies:
        tools:
          - get-security-requirements
          - check-change-risk
          - get-merge-attestation
  rovo:mcp:
    - key: threatline-mcp
      name: Threatline
      tools:
        - get-review
        - get-security-requirements
        - check-change-risk
        - get-merge-attestation
        - request-risk-acceptance
        - verify-requirement
        - explain-threat
        - posture-summary
  rovo:agent:
    - key: threatline-reviewer
      name: Threatline
      description: Security reviewer for Jira work items. Builds cited STRIDE threat models and explains what must be fixed before Done or merge.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - What do I need to fix before PROJ-142 can merge?
        - Is release 4.2 safe to ship?
        - Which acceptances expire this month?
        - Explain threat T-7 like I'm new to security
      actions: [ get-review-context, submit-threat-model, get-review, get-security-requirements, check-change-risk, get-merge-attestation, request-risk-acceptance, verify-requirement, explain-threat, release-readiness, start-review, posture-summary ]
      skills: [ threat-model-review ]
  function:
    - key: lifecycleFn
      handler: index.lifecycleHandler
    - key: issueEventsFn
      handler: index.issueEventHandler
    - key: pageEventsFn
      handler: index.pageEventHandler
    - key: jobConsumerFn
      handler: index.jobConsumerHandler
      timeoutSeconds: 300
    - key: sweeperFn
      handler: index.sweeperHandler
    - key: hourlyFn
      handler: index.hourlyHandler
    - key: dailyFn
      handler: index.dailyHandler
    - key: panelResolverFn
      handler: index.panelResolver
    - key: getReviewContextFn
      handler: index.getReviewContextHandler
    - key: submitThreatModelFn
      handler: index.submitThreatModelHandler
    - key: getMergeAttestationFn
      handler: index.getMergeAttestationHandler
    - key: getReviewFn
      handler: index.getReviewHandler
    - key: getRequirementsFn
      handler: index.getSecurityRequirementsHandler
    - key: checkChangeRiskFn
      handler: index.checkChangeRiskHandler
    - key: requestAcceptanceFn
      handler: index.requestRiskAcceptanceHandler
    - key: verifyRequirementFn
      handler: index.verifyRequirementHandler
    - key: explainThreatFn
      handler: index.explainThreatHandler
    - key: releaseReadinessFn
      handler: index.releaseReadinessHandler
    - key: startReviewFn
      handler: index.startReviewHandler
    - key: postureSummaryFn
      handler: index.postureSummaryHandler
    - key: validateTransitionFn
      handler: index.validateTransitionHandler
    - key: ciVerifyFn
      handler: index.ciVerifyHandler
resources:
  - key: panel
    path: ui/build
  - key: agent-prompt
    path: agent
  - key: icons
    path: icons
permissions:
  scopes:
    read:jira-work:
      allowImpersonation: true
    write:jira-work: {}
    read:jira-user:
      allowImpersonation: true
    storage:app: {}
    read:confluence-content.summary: {}
    read:confluence-content.permission: {}
    read:page:confluence: {}
    write:page:confluence: {}
    read:space:confluence: {}
    manage:jira-project: {}
    # Teamwork Graph (read only, as the viewing user): pull requests and deployments linked to a work item, from any
    # connected provider. Shown to that viewer only, never stored, never sent to a model.
    read:graph:issue:jira: {}
    read:graph:pull-request:external: {}
    read:graph:deployment:external: {}
    # Adds the Done gate to a project's workflow when an admin clicks "Add the gate for me" (as that admin).
    manage:jira-configuration:
      allowImpersonation: true
